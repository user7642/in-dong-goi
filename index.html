<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quản lý In & Đóng gói</title>
<style>
  :root{
    --bg:#f5f6f7;
    --card:#ffffff;
    --border:#e2e4e7;
    --text:#1a1d21;
    --muted:#6b7280;
    --blue:#2563eb;
    --blue-bg:#eaf1ff;
    --amber:#b45309;
    --amber-bg:#fef3e0;
    --green:#15803d;
    --green-bg:#e8f7ec;
    --red:#dc2626;
    --gray-bg:#eceef0;
    --maxw:680px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:90px;
  }
  /* header, thanh addbar/searchbar sticky, main, footer-style bars đều dùng
     chung 1 độ rộng tối đa (--maxw), canh giữa — để trên desktop các khối
     thẳng hàng nhau thay vì header/thanh công cụ chạy full-width còn danh
     sách bên dưới bị bó hẹp lại trông lệch. */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
    max-width:var(--maxw);
    margin:0 auto;
  }
  h1{font-size:18px;margin:0 0 12px 0;font-weight:600;}
  .tabs{display:flex;gap:6px;}
  .tab{
    flex:1;
    text-align:center;
    padding:12px 4px;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
    user-select:none;
  }
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .count-badge{
    display:inline-block;
    background:var(--border);
    color:var(--text);
    border-radius:10px;
    font-size:12px;
    padding:1px 7px;
    margin-left:5px;
  }
  .tab.active .count-badge{background:var(--blue);color:#fff;}

  .addbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    gap:8px;
    position:sticky;
    top:53px;
    z-index:19;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .addbar input[type=text]{
    flex:1;
    min-width:0;
    font-size:16px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .addbar input[type=number]{
    width:64px;
    font-size:16px;
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    text-align:center;
  }
  .addbar button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
  }

  .searchbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
    position:sticky;
    top:106px;
    z-index:18;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .searchbar input{
    width:100%;
    font-size:15px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }

  .quicklink{padding:10px 12px 0 12px;}
  .quicklink a{
    display:block;
    text-align:center;
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:600;
    font-size:14px;
    padding:11px 12px;
    border-radius:8px;
    text-decoration:none;
  }

  main{padding:12px 12px 0 12px;max-width:var(--maxw);margin:0 auto;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }

  .errbox{
    background:#fde8e8;
    color:var(--red);
    border:1px solid #f5b8b8;
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:10px;
  }

  /* ---- Order box (grouping) ---- */
  .order-box{
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    background:var(--card);
  }
  .order-box.warn{border-color:var(--amber);}
  .order-box.ready{border-color:var(--green);}
  .order-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 36px 10px 12px;
    background:#fafbfc;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .order-title{
    font-size:14px;
    font-weight:700;
    text-align:center;
    word-break:break-word;
  }
  .order-header .edit-icon{
    position:absolute;
    right:8px;top:50%;transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
    color:var(--muted);
    border:none;background:none;padding:6px;
  }
  .order-header input.order-title-input{
    font-size:14px;font-weight:700;text-align:center;
    border:1px solid var(--blue);border-radius:6px;padding:5px 8px;
    flex:1;max-width:220px;
  }
  .order-header .save-icon{
    border:none;background:var(--blue);color:#fff;border-radius:6px;
    padding:6px 9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .order-status-line{font-size:11.5px;text-align:center;padding:6px 12px 0;color:var(--muted);}
  .order-status-line.warn{color:var(--amber);font-weight:600;}
  .order-status-line.ready{color:var(--green);font-weight:600;}
  .pack-all-wrap{padding:8px 12px 10px;text-align:center;}
  .pack-all-btn{
    background:var(--green);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;
  }

  .order-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px;border-bottom:1px solid var(--border);
  }
  .order-item:last-child{border-bottom:none;}
  .order-item input[type=checkbox]{width:22px;height:22px;flex-shrink:0;margin-top:2px;accent-color:var(--blue);}
  .order-item .info{flex:1;min-width:0;}
  .order-item .name{font-size:16px;font-weight:600;line-height:1.3;word-break:break-word;}
  .order-item .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .order-item .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .order-item button.mini{
    border:none;border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--gray-bg);color:var(--text);
  }
  .order-item button.mini.primary{background:var(--blue-bg);color:var(--blue);}
  .order-item button.mini.warnbtn{background:var(--amber-bg);color:var(--amber);}
  .order-item button.mini.danger{background:#fde8e8;color:var(--red);}

  .note-preview{
    margin-top:5px;font-size:12.5px;color:var(--blue);background:var(--blue-bg);
    padding:6px 8px;border-radius:6px;word-break:break-word;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .note-box{margin-top:8px;}
  .note-box textarea{
    width:100%;font-size:13px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;min-height:54px;font-family:inherit;
  }
  .note-box .note-save{
    margin-top:5px;font-size:12px;padding:6px 11px;border:none;border-radius:6px;
    background:var(--blue);color:#fff;cursor:pointer;font-weight:600;
  }
  .note-dot{color:var(--blue);font-size:16px;line-height:0;margin-left:2px;}

  .edit-fields{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .edit-fields input[type=text]{flex:1;min-width:100px;font-size:14px;padding:8px 9px;border:1px solid var(--border);border-radius:8px;}
  .edit-fields input[type=number]{width:60px;font-size:14px;padding:8px 6px;border:1px solid var(--border);border-radius:8px;text-align:center;}

  .batchbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--text);
    color:#fff;
    padding:12px 14px;
    display:none;
    align-items:center;
    gap:10px;
    z-index:30;
    max-width:var(--maxw);
    margin:0 auto;
    border-radius:12px 12px 0 0;
  }
  .batchbar.show{display:flex;}
  .batchbar span{flex:1;font-size:14px;}
  .batchbar button{
    border:none;
    border-radius:8px;
    padding:11px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .batchbar .done-btn{background:var(--green);color:#fff;}
  .batchbar .del-btn{background:var(--red);color:#fff;}

  .listToolbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:4px 2px 10px;
  }
  .selectAllRow{
    display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;
  }
  .selectAllRow input{width:20px;height:20px;accent-color:var(--blue);}
  .clearAllBtn{
    border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;
    background:#fde8e8;color:var(--red);cursor:pointer;
  }
  .batchbar .ship-btn{background:var(--blue);color:#fff;}
  .shipped-badge{
    display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;
    color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:2px 7px;
  }

  .status-line{
    font-size:11px;
    text-align:center;
    color:var(--muted);
    padding:8px 0 2px 0;
    max-width:var(--maxw);
    margin:0 auto;
  }
</style>
</head>
<body>

<header>
  <h1>Quản lý In &amp; Đóng gói</h1>
  <div class="tabs">
    <div class="tab active" data-tab="in">In <span class="count-badge" id="badge-in">0</span></div>
    <div class="tab" data-tab="dong_goi">Đóng gói <span class="count-badge" id="badge-dong_goi">0</span></div>
    <div class="tab" data-tab="xong">Đã xong <span class="count-badge" id="badge-xong">0</span></div>
  </div>
</header>

<div class="addbar" id="addbar">
  <input type="text" id="newName" placeholder="Tên sản phẩm...">
  <input type="number" id="newQty" placeholder="SL" value="1" min="1">
  <button id="addBtn">+</button>
</div>

<div class="searchbar">
  <input type="text" id="searchTask" placeholder="🔍 Tìm việc theo tên hoặc tên đơn...">
</div>

<main>
  <div class="quicklink"><a href="catalog.html">+ Thêm danh sách công việc</a></div>
  <div class="quicklink" style="padding-top:8px;"><a href="huong-dan.html" style="background:var(--green-bg);color:var(--green);">📖 Hướng dẫn sử dụng</a></div>
  <div id="errArea"></div>
  <div class="listToolbar" id="listToolbar">
    <label class="selectAllRow"><input type="checkbox" id="selectAllBox"> Chọn tất cả</label>
    <button class="clearAllBtn" id="clearAllBtn" style="display:none;">🧹 Làm sạch</button>
  </div>
  <div id="list"></div>
</main>

<div class="status-line" id="connStatus"></div>

<div class="batchbar" id="batchbar">
  <span id="batchCount">0 đã chọn</span>
  <button class="done-btn" id="batchDone"></button>
  <button class="ship-btn" id="batchShip" style="display:none;">🚚 Đã giao</button>
  <button class="del-btn" id="batchDel">Xóa</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc,
  updateDoc, deleteDoc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7KyouXCw0dgRJK8pUiHkay8sUjqhGM3g",
  authDomain: "in-dong-goi.firebaseapp.com",
  projectId: "in-dong-goi",
  storageBucket: "in-dong-goi.firebasestorage.app",
  messagingSenderId: "532007763879",
  appId: "1:532007763879:web:8d752aa4d86fd317ca0082"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const tasksCol = collection(db, "tasks");

let currentTab = "in";
let allTasks = [];
let selected = new Set();
let searchTerm = "";

// UI-only ephemeral state (reset on re-render is fine; kept across snapshots via Sets keyed by id)
let openNotes = new Set();
let editingTaskIds = new Set();
let editingOrderIds = new Set();

const list = document.getElementById("list");
const connStatus = document.getElementById("connStatus");
const batchbar = document.getElementById("batchbar");
const addbar = document.getElementById("addbar");
const errArea = document.getElementById("errArea");
const selectAllBox = document.getElementById("selectAllBox");
const clearAllBtn = document.getElementById("clearAllBtn");

function showError(msg){
  errArea.innerHTML = `<div class="errbox">⚠️ ${escapeHtml(msg)}</div>`;
  setTimeout(() => { errArea.innerHTML = ""; }, 6000);
}

// ---- Helper: commit an edit (save) either on explicit click or on click-away ----
// Attaches a "focusout" listener to containerEl; if focus moves to something
// outside containerEl, commitFn() runs automatically (click ra ngoài = lưu & đóng).
// The returned function can be wired to a "Lưu" button so both paths share
// the same one-shot commit (no double-submit).
function attachClickAwayCommit(containerEl, commitFn){
  let committed = false;
  const commit = () => {
    if(committed) return;
    committed = true;
    commitFn();
  };
  containerEl.addEventListener("focusout", () => {
    setTimeout(() => {
      if(!containerEl.isConnected) return; // already closed/removed (e.g. Hủy)
      if(!containerEl.contains(document.activeElement)) commit();
    }, 0);
  });
  return commit;
}

// ---- Helpers: id / name generation for orders ----
function randCode(len){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function newOrderId(){ return "o_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function newOrderName(){ return "Đơn " + randCode(3); }

// ---- Tabs ----
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    selected.clear();
    addbar.style.display = currentTab === "in" ? "flex" : "none";
    clearAllBtn.style.display = currentTab === "xong" ? "inline-block" : "none";
    render();
  });
});
addbar.style.display = "flex";

// ---- Chọn tất cả ----
selectAllBox.addEventListener("change", () => {
  const shown = getShown();
  if(selectAllBox.checked) shown.forEach(t => selected.add(t.id));
  else shown.forEach(t => selected.delete(t.id));
  updateBatchBar();
  render();
});

// ---- Làm sạch (xóa toàn bộ sản phẩm đã xong) ----
clearAllBtn.addEventListener("click", async () => {
  const items = allTasks.filter(t => t.status === "xong");
  if(items.length === 0) return;
  if(!confirm(`Xóa toàn bộ ${items.length} sản phẩm đã xong? Không thể hoàn tác.`)) return;
  try{
    for(const it of items){
      await deleteDoc(doc(db, "tasks", it.id));
    }
    selected.clear();
    updateBatchBar();
  }catch(e){ showError("Không làm sạch được danh sách: " + e.message); }
});

// ---- Search ----
document.getElementById("searchTask").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// ---- Add task ----
document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("newName").addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

async function addTask(){
  const nameEl = document.getElementById("newName");
  const qtyEl = document.getElementById("newQty");
  const name = nameEl.value.trim();
  const qty = parseInt(qtyEl.value) || 1;
  if(!name) return;
  try{
    await addDoc(tasksCol, {
      name, qty,
      status: "cho_in",
      note: "",
      orderId: newOrderId(),
      orderName: newOrderName(),
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    nameEl.value = "";
    qtyEl.value = "1";
    nameEl.focus();
  }catch(e){
    showError("Không thêm được việc mới: " + e.message);
  }
}

// ---- Realtime listener ----
const q = query(tasksCol, orderBy("createdAt", "asc"));
onSnapshot(q, snap => {
  allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  connStatus.textContent = "";
  render();
}, err => {
  connStatus.textContent = "Lỗi kết nối: " + err.message;
});

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- Grouping helpers ----
function orderPackInfo(orderId){
  const items = allTasks.filter(t => t.orderId === orderId);
  const pending = items.filter(t => t.status === "cho_in" || t.status === "dang_in").length;
  const readyToPack = items.filter(t => t.status === "cho_dong_goi").length;
  const doneAlready = items.filter(t => t.status === "xong").length;
  return {
    total: items.length,
    pending, readyToPack, doneAlready,
    eligible: pending === 0 && readyToPack > 0
  };
}

function groupShown(shown){
  const order = [];
  const map = new Map();
  shown.forEach(t => {
    const oid = t.orderId || t.id;
    if(!map.has(oid)){
      map.set(oid, { orderId: oid, orderName: t.orderName || t.name, items: [] });
      order.push(oid);
    }
    map.get(oid).items.push(t);
  });
  return order.map(oid => map.get(oid));
}

// ---- Render ----
function getShown(){
  let shown;
  if(currentTab === "in") shown = allTasks.filter(t => t.status === "cho_in" || t.status === "dang_in");
  else if(currentTab === "dong_goi") shown = allTasks.filter(t => t.status === "cho_dong_goi");
  else shown = allTasks.filter(t => t.status === "xong").slice(-50).reverse();

  if(searchTerm){
    shown = shown.filter(t =>
      (t.name || "").toLowerCase().includes(searchTerm) ||
      (t.orderName || "").toLowerCase().includes(searchTerm)
    );
  }
  return shown;
}

function updateSelectAllBox(shown){
  const n = shown.length;
  const nSel = shown.filter(t => selected.has(t.id)).length;
  selectAllBox.checked = n > 0 && nSel === n;
  selectAllBox.indeterminate = nSel > 0 && nSel < n;
}

function render(){
  const badgeIn = allTasks.filter(t => t.status === "cho_in" || t.status === "dang_in").length;
  const badgeDG = allTasks.filter(t => t.status === "cho_dong_goi").length;
  const badgeXong = allTasks.filter(t => t.status === "xong").length;
  document.getElementById("badge-in").textContent = badgeIn;
  document.getElementById("badge-dong_goi").textContent = badgeDG;
  document.getElementById("badge-xong").textContent = badgeXong;

  const shown = getShown();
  updateSelectAllBox(shown);

  list.innerHTML = "";
  if(shown.length === 0){
    const emptyMsg = searchTerm ? "Không tìm thấy việc nào khớp."
      : currentTab === "in" ? "Chưa có việc nào. Thêm sản phẩm ở ô trên."
      : currentTab === "dong_goi" ? "Chưa có sản phẩm nào chờ đóng gói."
      : "Chưa có sản phẩm nào hoàn tất.";
    list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }

  const groups = groupShown(shown);
  groups.forEach(g => list.appendChild(renderOrderBox(g)));
}

function renderOrderBox(g){
  const box = document.createElement("div");
  box.className = "order-box";

  let info = null;
  if(currentTab === "dong_goi"){
    info = orderPackInfo(g.orderId);
    box.classList.add(info.eligible ? "ready" : "warn");
  }

  const header = document.createElement("div");
  header.className = "order-header";

  if(editingOrderIds.has(g.orderId)){
    const input = document.createElement("input");
    input.type = "text";
    input.className = "order-title-input";
    input.value = g.orderName;
    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(header, () => renameOrder(g.orderId, input.value));
    saveBtn.addEventListener("click", commit);
    input.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    header.appendChild(input);
    header.appendChild(saveBtn);
    setTimeout(() => input.focus(), 0);
  } else {
    const title = document.createElement("div");
    title.className = "order-title";
    title.textContent = g.orderName;
    const editBtn = document.createElement("button");
    editBtn.className = "edit-icon";
    editBtn.textContent = "✏️";
    editBtn.addEventListener("click", () => {
      editingOrderIds.add(g.orderId);
      render();
    });
    header.appendChild(title);
    header.appendChild(editBtn);
  }
  box.appendChild(header);

  if(currentTab === "dong_goi" && info){
    const line = document.createElement("div");
    line.className = "order-status-line " + (info.eligible ? "ready" : "warn");
    line.textContent = info.eligible
      ? "Đủ hàng — có thể đóng gói cả đơn"
      : `Đơn chưa đủ — còn ${info.pending} sản phẩm đang in`;
    box.appendChild(line);

    if(info.eligible){
      const wrap = document.createElement("div");
      wrap.className = "pack-all-wrap";
      const btn = document.createElement("button");
      btn.className = "pack-all-btn";
      btn.textContent = "📦 Đóng gói cả đơn";
      btn.addEventListener("click", () => packWholeOrder(g.orderId));
      wrap.appendChild(btn);
      box.appendChild(wrap);
    }
  }

  g.items.forEach(t => box.appendChild(renderItem(t)));
  return box;
}

function renderItem(t){
  const row = document.createElement("div");
  row.className = "order-item";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = selected.has(t.id);
  cb.addEventListener("change", () => {
    if(cb.checked) selected.add(t.id); else selected.delete(t.id);
    updateBatchBar();
  });
  row.appendChild(cb);

  const info = document.createElement("div");
  info.className = "info";

  if(editingTaskIds.has(t.id)){
    info.innerHTML = `<div class="meta">Sửa việc:</div>`;
    const fields = document.createElement("div");
    fields.className = "edit-fields";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = t.name;
    const qtyInput = document.createElement("input");
    qtyInput.type = "number";
    qtyInput.min = "1";
    qtyInput.value = t.qty || 1;
    const saveBtn = document.createElement("button");
    saveBtn.className = "mini primary";
    saveBtn.textContent = "Lưu";
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "mini";
    cancelBtn.textContent = "Hủy";
    const commit = attachClickAwayCommit(fields, () => saveTaskEdit(t.id, nameInput.value, qtyInput.value));
    saveBtn.addEventListener("click", commit);
    cancelBtn.addEventListener("click", () => { editingTaskIds.delete(t.id); render(); });
    fields.appendChild(nameInput);
    fields.appendChild(qtyInput);
    fields.appendChild(saveBtn);
    fields.appendChild(cancelBtn);
    info.appendChild(fields);
    setTimeout(() => nameInput.focus(), 0);
  } else {
    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = t.name;
    if(currentTab === "xong" && t.shipped){
      const badge = document.createElement("span");
      badge.className = "shipped-badge";
      badge.textContent = "🚚 Đã giao";
      nameDiv.appendChild(badge);
    }
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    metaDiv.textContent = "SL: " + (t.qty || 1);
    info.appendChild(nameDiv);
    info.appendChild(metaDiv);

    // Xem trước ghi chú ngay trên danh sách (không cần bấm Sửa mới thấy).
    // Dùng dạng xem trước thay vì tooltip vì tooltip cần hover, không dùng
    // được trên điện thoại (chạm) — xem trước luôn hiện + bấm vào để sửa
    // là cách hoạt động tốt trên di động hơn.
    if(t.note && !openNotes.has(t.id)){
      const preview = document.createElement("div");
      preview.className = "note-preview";
      preview.textContent = "📝 " + t.note;
      preview.addEventListener("click", () => { openNotes.add(t.id); render(); });
      info.appendChild(preview);
    }

    const actions = document.createElement("div");
    actions.className = "row-actions";

    if(currentTab !== "xong"){
      const advBtn = document.createElement("button");
      advBtn.className = "mini primary";
      advBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã đóng gói";
      advBtn.addEventListener("click", () => advanceStatus(t));
      actions.appendChild(advBtn);
    }

    if(currentTab === "dong_goi" || currentTab === "xong"){
      const revBtn = document.createElement("button");
      revBtn.className = "mini warnbtn";
      revBtn.textContent = "↩ Lùi lại";
      revBtn.addEventListener("click", () => revertStatus(t));
      actions.appendChild(revBtn);
    }

    if(currentTab === "xong"){
      const shipBtn = document.createElement("button");
      shipBtn.className = "mini" + (t.shipped ? "" : " primary");
      shipBtn.textContent = t.shipped ? "↩ Bỏ đã giao" : "🚚 Đã giao";
      shipBtn.addEventListener("click", () => toggleShipped(t));
      actions.appendChild(shipBtn);
    }

    const editBtn = document.createElement("button");
    editBtn.className = "mini";
    editBtn.textContent = "✏️ Sửa";
    editBtn.addEventListener("click", () => { editingTaskIds.add(t.id); render(); });
    actions.appendChild(editBtn);

    const noteBtn = document.createElement("button");
    noteBtn.className = "mini";
    noteBtn.innerHTML = "📝 Ghi chú" + (t.note ? "<span class='note-dot'>•</span>" : "");
    noteBtn.addEventListener("click", () => {
      if(openNotes.has(t.id)) openNotes.delete(t.id); else openNotes.add(t.id);
      render();
    });
    actions.appendChild(noteBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "mini danger";
    delBtn.textContent = "🗑 Xóa";
    delBtn.addEventListener("click", () => deleteTask(t.id));
    actions.appendChild(delBtn);

    info.appendChild(actions);

    if(openNotes.has(t.id)){
      const noteBox = document.createElement("div");
      noteBox.className = "note-box";
      const ta = document.createElement("textarea");
      ta.placeholder = "Ghi chú cho việc này...";
      ta.value = t.note || "";
      const saveNoteBtn = document.createElement("button");
      saveNoteBtn.className = "note-save";
      saveNoteBtn.textContent = "Lưu ghi chú";
      const commit = attachClickAwayCommit(noteBox, async () => {
        await saveNote(t.id, ta.value);
        openNotes.delete(t.id);
        render();
      });
      saveNoteBtn.addEventListener("click", commit);
      noteBox.appendChild(ta);
      noteBox.appendChild(saveNoteBtn);
      info.appendChild(noteBox);
      setTimeout(() => ta.focus(), 0);
    }
  }

  row.appendChild(info);
  return row;
}

// ---- Actions ----
async function advanceStatus(t){
  const next = t.status === "cho_in" || t.status === "dang_in" ? "cho_dong_goi" : "xong";
  try{
    await updateDoc(doc(db, "tasks", t.id), { status: next, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không cập nhật được trạng thái: " + e.message); }
}

async function revertStatus(t){
  const prev = t.status === "cho_dong_goi" ? "cho_in" : t.status === "xong" ? "cho_dong_goi" : null;
  if(!prev) return;
  try{
    await updateDoc(doc(db, "tasks", t.id), { status: prev, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không lùi được trạng thái: " + e.message); }
}

async function toggleShipped(t){
  try{
    await updateDoc(doc(db, "tasks", t.id), { shipped: !t.shipped, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không cập nhật được trạng thái đã giao: " + e.message); }
}

async function markShipped(id, value){
  try{
    await updateDoc(doc(db, "tasks", id), { shipped: value, updatedAt: serverTimestamp() });
  }catch(e){ showError("Không cập nhật được trạng thái đã giao: " + e.message); }
}

async function packWholeOrder(orderId){
  const items = allTasks.filter(t => t.orderId === orderId && t.status === "cho_dong_goi");
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { status: "xong", updatedAt: serverTimestamp() });
    }
  }catch(e){ showError("Không đóng gói được cả đơn: " + e.message); }
}

async function saveTaskEdit(id, name, qty){
  const n = (name || "").trim();
  const q = parseInt(qty) || 1;
  if(!n){ showError("Tên sản phẩm không được để trống."); return; }
  try{
    await updateDoc(doc(db, "tasks", id), { name: n, qty: q, updatedAt: serverTimestamp() });
    editingTaskIds.delete(id);
    render();
  }catch(e){ showError("Không lưu được thay đổi: " + e.message); }
}

async function saveNote(id, note){
  try{
    await updateDoc(doc(db, "tasks", id), { note: note || "", updatedAt: serverTimestamp() });
  }catch(e){ showError("Không lưu được ghi chú: " + e.message); }
}

async function deleteTask(id){
  if(!confirm("Xóa việc này?")) return;
  try{
    await deleteDoc(doc(db, "tasks", id));
  }catch(e){ showError("Không xóa được: " + e.message); }
}

async function renameOrder(orderId, newName){
  const n = (newName || "").trim() || newOrderName();
  const items = allTasks.filter(t => t.orderId === orderId);
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { orderName: n, updatedAt: serverTimestamp() });
    }
    editingOrderIds.delete(orderId);
    render();
  }catch(e){ showError("Không đổi được tên đơn: " + e.message); }
}

// ---- Batch actions ----
function updateBatchBar(){
  const n = selected.size;
  document.getElementById("batchCount").textContent = n + " đã chọn";
  const doneBtn = document.getElementById("batchDone");
  const shipBtn = document.getElementById("batchShip");
  if(currentTab === "xong"){
    doneBtn.style.display = "none";
    shipBtn.style.display = "inline-block";
  } else {
    doneBtn.style.display = "inline-block";
    doneBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã đóng gói";
    shipBtn.style.display = "none";
  }
  batchbar.classList.toggle("show", n > 0);
}

document.getElementById("batchShip").addEventListener("click", async () => {
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      await markShipped(id, true);
    }
  }catch(e){ showError("Lỗi khi đánh dấu đã giao theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDone").addEventListener("click", async () => {
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      const t = allTasks.find(x => x.id === id);
      if(t) await advanceStatus(t);
    }
  }catch(e){ showError("Lỗi khi xử lý theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDel").addEventListener("click", async () => {
  if(!confirm("Xóa " + selected.size + " mục đã chọn?")) return;
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      await deleteDoc(doc(db, "tasks", id));
    }
  }catch(e){ showError("Không xóa được các mục đã chọn: " + e.message); }
  selected.clear();
  updateBatchBar();
});
</script>
