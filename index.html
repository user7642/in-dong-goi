<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quản lý In & Đóng gói</title>
<style>
  :root{
    --bg:#f5f6f7;
    --card:#ffffff;
    --border:#e2e4e7;
    --text:#1a1d21;
    --muted:#6b7280;
    --blue:#2563eb;
    --blue-bg:#eaf1ff;
    --amber:#b45309;
    --amber-bg:#fef3e0;
    --green:#15803d;
    --green-bg:#e8f7ec;
    --red:#dc2626;
    --gray-bg:#eceef0;
    --maxw:680px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding-bottom:90px;
  }
  /* header, thanh addbar/searchbar sticky, main, footer-style bars đều dùng
     chung 1 độ rộng tối đa (--maxw), canh giữa — để trên desktop các khối
     thẳng hàng nhau thay vì header/thanh công cụ chạy full-width còn danh
     sách bên dưới bị bó hẹp lại trông lệch. */
  header{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:20;
    max-width:var(--maxw);
    margin:0 auto;
  }
  h1{font-size:18px;margin:0 0 12px 0;font-weight:600;}
  .tabs{display:flex;gap:6px;}
  .tab{
    flex:1;
    text-align:center;
    padding:12px 4px;
    font-size:15px;
    font-weight:600;
    color:var(--muted);
    border-bottom:3px solid transparent;
    cursor:pointer;
    user-select:none;
  }
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);}
  .count-badge{
    display:inline-block;
    background:var(--border);
    color:var(--text);
    border-radius:10px;
    font-size:12px;
    padding:1px 7px;
    margin-left:5px;
  }
  .tab.active .count-badge{background:var(--blue);color:#fff;}

  .addbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:10px 16px;
    display:flex;
    gap:8px;
    position:sticky;
    top:53px;
    z-index:19;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .addbar input[type=text]{
    flex:1;
    min-width:0;
    font-size:16px;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .addbar input[type=number]{
    width:64px;
    font-size:16px;
    padding:11px 6px;
    border:1px solid var(--border);
    border-radius:8px;
    text-align:center;
  }
  .addbar button{
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:0 16px;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
  }

  .searchbar{
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:8px 16px;
    position:sticky;
    top:106px;
    z-index:18;
    max-width:var(--maxw);
    margin:0 auto;
  }
  .searchbar input{
    width:100%;
    font-size:15px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
  }

  .quicklink{padding:10px 12px 0 12px;}
  .quicklink a{
    display:block;
    text-align:center;
    background:var(--blue-bg);
    color:var(--blue);
    font-weight:600;
    font-size:14px;
    padding:11px 12px;
    border-radius:8px;
    text-decoration:none;
  }

  main{padding:12px 12px 0 12px;max-width:var(--maxw);margin:0 auto;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
    font-size:14px;
  }

  .errbox{
    background:#fde8e8;
    color:var(--red);
    border:1px solid #f5b8b8;
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    margin-bottom:10px;
  }

  /* ---- Order box (grouping) ---- */
  .order-box{
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    overflow:hidden;
    background:var(--card);
  }
  .order-box.warn{border-color:var(--amber);}
  .order-box.ready{border-color:var(--green);}
  .order-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 36px 10px 12px;
    background:#fafbfc;
    border-bottom:1px solid var(--border);
    position:relative;
  }
  .order-title{
    font-size:14px;
    font-weight:700;
    text-align:center;
    word-break:break-word;
  }
  .order-header.clickable{cursor:pointer;user-select:none;}
  .expand-caret{
    display:inline-block;width:14px;color:var(--muted);font-weight:400;
  }
  .ship-label-chip{font-size:12px;margin-left:2px;}
  .order-header .edit-icon{
    position:absolute;
    right:8px;top:50%;transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
    color:var(--muted);
    border:none;background:none;padding:6px;
  }
  .order-header input.order-title-input{
    font-size:14px;font-weight:700;text-align:center;
    border:1px solid var(--blue);border-radius:6px;padding:5px 8px;
    flex:1;max-width:220px;
  }
  .order-header .save-icon{
    border:none;background:var(--blue);color:#fff;border-radius:6px;
    padding:6px 9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .order-status-line{font-size:11.5px;text-align:center;padding:6px 12px 0;color:var(--muted);}
  .order-status-line.warn{color:var(--amber);font-weight:600;}
  .order-status-line.ready{color:var(--green);font-weight:600;}
  .pack-all-wrap{padding:8px 12px 10px;text-align:center;}
  .pack-all-btn{
    background:var(--green);color:#fff;border:none;border-radius:8px;
    padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;
  }

  /* Phiếu giao (mã đơn vận) đính kèm PDF — dùng chung cho cả đơn hàng, không
     phải theo từng sản phẩm, nên đặt ngay dưới order-header. */
  .ship-label-row{
    padding:9px 12px;
    border-bottom:1px solid var(--border);
    display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
    background:#fbfcfd;
  }
  .ship-label-row button{
    border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .ship-label-row .attach-btn{background:var(--blue-bg);color:var(--blue);}
  .ship-label-row .view-btn{background:var(--gray-bg);color:var(--text);}
  .ship-label-row .download-btn{background:var(--green-bg);color:var(--green);}
  .ship-label-row .remove-btn{background:#fde8e8;color:var(--red);}
  .ship-label-row button[disabled]{opacity:.6;cursor:default;}

  .order-item{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px;border-bottom:1px solid var(--border);
  }
  .order-item:last-child{border-bottom:none;}
  .order-item input[type=checkbox]{width:22px;height:22px;flex-shrink:0;margin-top:2px;accent-color:var(--blue);}
  .order-item .info{flex:1;min-width:0;}
  .order-item .name{font-size:16px;font-weight:600;line-height:1.3;word-break:break-word;}
  .order-item .meta{font-size:13px;color:var(--muted);margin-top:2px;}
  .order-item .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .order-item button.mini{
    border:none;border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer;
    background:var(--gray-bg);color:var(--text);
  }
  .order-item button.mini.primary{background:var(--blue-bg);color:var(--blue);}
  .order-item button.mini.warnbtn{background:var(--amber-bg);color:var(--amber);}
  .order-item button.mini.danger{background:#fde8e8;color:var(--red);}

  .note-preview{
    margin-top:5px;font-size:12.5px;color:var(--blue);background:var(--blue-bg);
    padding:6px 8px;border-radius:6px;word-break:break-word;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .note-box{margin-top:8px;}
  .note-box textarea{
    width:100%;font-size:13px;padding:8px 9px;border:1px solid var(--border);
    border-radius:8px;min-height:54px;font-family:inherit;
  }
  .note-box .note-save{
    margin-top:5px;font-size:12px;padding:6px 11px;border:none;border-radius:6px;
    background:var(--blue);color:#fff;cursor:pointer;font-weight:600;
  }
  .note-dot{color:var(--blue);font-size:16px;line-height:0;margin-left:2px;}

  /* Overlay sửa việc (tên + số lượng) — kiểu giống editor-overlay trong
     catalog.html: phủ toàn màn hình, dọc, chỗ nhập rộng rãi cho dễ bấm trên
     điện thoại thay vì ô nhỏ nhét chung 1 hàng như trước. */
  .task-editor-overlay{
    position:fixed;top:0;bottom:0;left:0;right:0;background:var(--bg);z-index:50;
    display:none;flex-direction:column;padding:16px;
    max-width:var(--maxw);margin:0 auto;
  }
  .task-editor-overlay.show{display:flex;}
  .task-editor-overlay h3{font-size:16px;margin:0 0 16px 0;}
  .task-editor-overlay .field-block{margin-bottom:16px;}
  .task-editor-overlay .field-block.grow{flex:1;display:flex;flex-direction:column;margin-bottom:0;}
  .task-editor-overlay label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;}
  .task-editor-overlay input[type=number]{
    width:110px;font-size:17px;padding:13px 10px;border:1px solid var(--border);
    border-radius:10px;text-align:center;
  }
  .task-editor-overlay textarea{
    flex:1;min-height:160px;font-size:16px;padding:12px;border:1px solid var(--border);
    border-radius:10px;resize:vertical;line-height:1.5;font-family:inherit;
  }
  .task-editor-overlay .editor-actions{display:flex;gap:8px;margin-top:14px;}
  .task-editor-overlay .editor-actions button{
    flex:1;padding:13px;font-size:15px;font-weight:600;border:none;border-radius:8px;cursor:pointer;
  }
  .task-editor-overlay .editor-actions .cancel-btn{background:var(--gray-bg);color:var(--text);}
  .task-editor-overlay .editor-actions .save-btn{background:var(--blue);color:#fff;}

  .batchbar{
    position:fixed;
    bottom:0;left:0;right:0;
    background:var(--text);
    color:#fff;
    padding:12px 14px;
    display:none;
    align-items:center;
    gap:10px;
    z-index:30;
    max-width:var(--maxw);
    margin:0 auto;
    border-radius:12px 12px 0 0;
  }
  .batchbar.show{display:flex;}
  .batchbar span{flex:1;font-size:14px;}
  .batchbar button{
    border:none;
    border-radius:8px;
    padding:11px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .batchbar .done-btn{background:var(--green);color:#fff;}
  .batchbar .del-btn{background:var(--red);color:#fff;}

  .listToolbar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:4px 2px 10px;
  }
  .selectAllRow{
    display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;
  }
  .selectAllRow input{width:20px;height:20px;accent-color:var(--blue);}
  .clearAllBtn{
    border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;
    background:#fde8e8;color:var(--red);cursor:pointer;
  }
  .download-all-wrap{padding:0 2px 10px;}
  .download-all-btn{
    width:100%;border:none;border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600;
    background:var(--green-bg);color:var(--green);cursor:pointer;
  }
  .batchbar .ship-btn{background:var(--blue);color:#fff;}
  .shipped-badge{
    display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;
    color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:2px 7px;
  }
  .task-linkchip{
    display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;
    color:var(--blue);background:var(--blue-bg);border-radius:8px;padding:2px 7px;
    text-decoration:none;
  }

  .status-line{
    font-size:11px;
    text-align:center;
    color:var(--muted);
    padding:8px 0 2px 0;
    max-width:var(--maxw);
    margin:0 auto;
  }
</style>
</head>

  <div class="quicklink" style="padding-top:8px;"><a href="huong-dan.html" style="background:var(--green-bg);color:var(--green);">📖 Hướng dẫn sử dụng</a></div>

<!-- Overlay sửa tên việc + số lượng — mở toàn màn hình khi bấm ✏️ Sửa, thay
     cho 2 ô nhỏ nhét chung 1 hàng như trước (khó bấm trên điện thoại). -->
<div class="task-editor-overlay" id="taskEditorOverlay">

<!-- jsQR: thư viện thuần JS đọc mã QR từ dữ liệu ảnh (canvas), dùng để đọc

// Phiếu giao (PDF) được lưu trên Cloudinary thay vì Firebase Storage — vì

let currentTab = "in";

function showError(msg){
  errArea.innerHTML = `<div class="errbox">⚠️ ${escapeHtml(msg)}</div>`;
  setTimeout(() => { errArea.innerHTML = ""; }, 6000);

// ---- Helper: commit an edit (save) either on explicit click or on click-away ----
// Attaches a "focusout" listener to containerEl; if focus moves to something
// outside containerEl, commitFn() runs automatically (click ra ngoài = lưu & đóng).
// The returned function can be wired to a "Lưu" button so both paths share
// the same one-shot commit (no double-submit).
function attachClickAwayCommit(containerEl, commitFn){
  let committed = false;
  const commit = () => {
    if(committed) return;
    committed = true;
    commitFn();
  };
  containerEl.addEventListener("focusout", () => {
    setTimeout(() => {
      if(!containerEl.isConnected) return; // already closed/removed (e.g. Hủy)
      if(!containerEl.contains(document.activeElement)) commit();
    }, 0);
  });
  return commit;
}

// ---- Overlay "Sửa việc" (tên + số lượng) — phủ toàn màn hình, chỗ nhập
// rộng rãi cho dễ bấm trên điện thoại, giống kiểu editor-overlay bên
// catalog.html thay vì nhét 2 ô nhỏ chung 1 hàng như trước. ----
function openTaskEditor(t){
  taskEditorCurrentId = t.id;
  taskEditorQty.value = t.qty || 1;
  taskEditorName.value = t.name;
  taskEditorOverlay.classList.add("show");
  setTimeout(() => taskEditorName.focus(), 0);
}

function closeTaskEditor(){
  taskEditorCurrentId = null;
  taskEditorOverlay.classList.remove("show");
}

document.getElementById("taskEditorCancel").addEventListener("click", closeTaskEditor);
document.getElementById("taskEditorSave").addEventListener("click", () => {
  if(taskEditorCurrentId) saveTaskEdit(taskEditorCurrentId, taskEditorName.value, taskEditorQty.value);
});

// ---- Helpers: id / name generation for orders ----
function randCode(len){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<len;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function newOrderId(){ return "o_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
// Mã tự sinh cho đơn không đặt tên — dài ~10 ký tự để giống độ dài mã vận đơn
// thật, nhưng luôn bắt đầu bằng "#": ký tự này KHÔNG BAO GIỜ xuất hiện trong
// mã vận đơn thật (mã thật chỉ toàn chữ/số, xem detectTrackingFromText và
// extractTrackingFromPdf ở trên) — nên chỉ cần nhìn ký tự đầu là phân biệt
// được ngay đây là mã giả tự sinh, không phải mã quét từ vận đơn thật.
function newOrderName(){ return "#" + randCode(9); }

// ---- Đóng khu vực phiếu giao đang mở khi bấm ra ngoài ----
// Click vào chính dòng tiêu đề (.order-header) đã tự xử lý mở/đóng riêng ở
// renderOrderBox(); click vào bên trong khu phiếu giao (.ship-label-row) cần
// giữ nguyên để còn bấm được các nút (Tải/Thay file/Xóa). Mọi click khác
// (kể cả vào sản phẩm bên dưới, đơn khác, thanh tìm kiếm...) đều đóng lại.
document.addEventListener("click", (e) => {
  if(expandedShipLabelOrderId === null) return;
  if(e.target.closest(".order-header") || e.target.closest(".ship-label-row")) return;
  expandedShipLabelOrderId = null;
  render();
});

// ---- Tabs ----
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    selected.clear();
    addbar.style.display = currentTab === "in" ? "flex" : "none";
    clearAllBtn.style.display = currentTab === "xong" ? "inline-block" : "none";
    render();
  });
});
addbar.style.display = "flex";

// ---- Chọn tất cả ----
selectAllBox.addEventListener("change", () => {
  const shown = getShown();
  if(selectAllBox.checked) shown.forEach(t => selected.add(t.id));
  else shown.forEach(t => selected.delete(t.id));
  updateBatchBar();
  render();
});

// ---- Làm sạch (xóa toàn bộ sản phẩm đã xong) ----
clearAllBtn.addEventListener("click", async () => {
  const items = allTasks.filter(t => t.status === "xong");
  if(items.length === 0) return;
  if(!confirm(`Xóa toàn bộ ${items.length} sản phẩm đã xong? Không thể hoàn tác.`)) return;
  try{
    for(const it of items){
      await deleteDoc(doc(db, "tasks", it.id));
    }
    selected.clear();
    updateBatchBar();
  }catch(e){ showError("Không làm sạch được danh sách: " + e.message); }
});

// ---- Search ----
document.getElementById("searchTask").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// ---- Add task ----
document.getElementById("addBtn").addEventListener("click", addTask);
document.getElementById("newName").addEventListener("keydown", e => { if(e.key === "Enter") addTask(); });

async function addTask(){
  const nameEl = document.getElementById("newName");
  const qtyEl = document.getElementById("newQty");
  const name = nameEl.value.trim();
  const qty = parseInt(qtyEl.value) || 1;
  if(!name) return;
  try{
    await addDoc(tasksCol, {
      name, qty,
      status: "cho_in",
      note: "",
      orderId: newOrderId(),
      orderName: newOrderName(),
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    nameEl.value = "";
    qtyEl.value = "1";
    nameEl.focus();
  }catch(e){
    showError("Không thêm được việc mới: " + e.message);
  }
}

// ---- Realtime listener ----
const q = query(tasksCol, orderBy("createdAt", "asc"));
onSnapshot(q, snap => {
  allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  connStatus.textContent = "";
  render();
  purgeExpiredXong();
}, err => {
  connStatus.textContent = "Lỗi kết nối: " + err.message;
});

// ---- Dọn dẹp item "xong" đã quá hạn ----
// Lưu ý: từ khi chuyển phiếu giao sang lưu ở Cloudinary, việc xóa file PDF
// không còn thực hiện được an toàn từ trình duyệt nữa (Cloudinary yêu cầu ký
// bằng API Secret để xóa, không thể nhúng secret đó vào code public trên
// GitHub Pages). Nên khi 1 đơn bị xóa (thủ công hoặc do quá hạn), chỉ Firestore
// doc bị xóa — file PDF cũ trên Cloudinary sẽ "mồ côi" (không tự dọn). Vì file
// phiếu giao rất nhẹ và gói free Cloudinary có 25GB/tháng, việc này không đáng
// ngại — đây là đánh đổi đã thống nhất để tránh phải khai thẻ cho Firebase Blaze.

// Quét chủ động các item "xong" đã quá hạn expireAt và xóa sớm hơn TTL server
// của Firestore (TTL có thể trễ tới 72 giờ) — giúp tab "Đã xong" luôn gọn
// trong đúng XONG_RETENTION_DAYS ngày gần nhất thay vì đợi Google tự dọn.
async function purgeExpiredXong(){
  const now = Date.now();
  const expired = allTasks.filter(t =>
    t.status === "xong" && t.expireAt && typeof t.expireAt.toMillis === "function" && t.expireAt.toMillis() <= now
  );
  if(expired.length === 0) return;
  try{
    for(const it of expired){
      await deleteDoc(doc(db, "tasks", it.id));
    }
  }catch(e){
    // Dọn dẹp nền — không làm phiền người dùng bằng lỗi nền không quan trọng.
  }
}

function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- Grouping helpers ----
function orderPackInfo(orderId){
  const items = allTasks.filter(t => t.orderId === orderId);
  const pending = items.filter(t => t.status === "cho_in").length;
  const readyToPack = items.filter(t => t.status === "cho_dong_goi").length;
  return {
    total: items.length,
    pending, readyToPack,
    eligible: pending === 0 && readyToPack > 0
  };
}

function groupShown(shown){
  const order = [];
  const map = new Map();
  shown.forEach(t => {
    const oid = t.orderId || t.id;
    if(!map.has(oid)){
      map.set(oid, { orderId: oid, orderName: t.orderName || t.name, shipLabelUrl: "", items: [] });
      order.push(oid);
    }
    const g = map.get(oid);
    // shipLabelUrl được ghi lặp lên mọi item cùng orderId (giống orderName) —
    // chỉ cần lấy giá trị đầu tiên tìm thấy trong cả nhóm.
    if(!g.shipLabelUrl && t.shipLabelUrl) g.shipLabelUrl = t.shipLabelUrl;
    g.items.push(t);
  });
  return order.map(oid => map.get(oid));
}

// Cho biết những orderId nào sẽ KHÔNG còn item nào sau khi xóa các id trong
// deletedIds — dùng để biết đơn nào "trống hẳn" (từ đó dọn phiếu giao đính
// kèm nếu cần). So sánh trên allTasks HIỆN TẠI (trước khi xóa thật sự), nên
// phải gọi hàm này trước khi deleteDoc(), không phải sau.
function orderIdsBecomingEmpty(deletedIds){
  const deletedSet = new Set(deletedIds);
  const affectedOrderIds = new Set(
    allTasks
      .filter(t => deletedSet.has(t.id))
      .map(t => t.orderId || t.id)
  );
  const result = [];
  affectedOrderIds.forEach(oid => {
    const remaining = allTasks.some(t => t.orderId === oid && !deletedSet.has(t.id));
    if(!remaining) result.push(oid);
  });
  return result;
}

// ---- Render ----
function getShown(){
  let shown;
  if(currentTab === "in") shown = allTasks.filter(t => t.status === "cho_in");
  else if(currentTab === "dong_goi") shown = allTasks.filter(t => t.status === "cho_dong_goi");
  // Không còn cần giới hạn 50 mục ở client nữa: từ khi có expireAt + Firestore
  // TTL (xem phần "Đã xong" trong hướng dẫn), tập dữ liệu status=xong đã tự
  // giới hạn trong khoảng 7 ngày gần nhất, không phình vô hạn. Bỏ slice() để
  // tìm kiếm (Lỗi A) có thể quét đúng toàn bộ 7 ngày thay vì chỉ 50 mục mới nhất.
  else shown = allTasks.filter(t => t.status === "xong").slice().reverse();

  if(searchTerm){
    shown = shown.filter(t =>
      (t.name || "").toLowerCase().includes(searchTerm) ||
      (t.orderName || "").toLowerCase().includes(searchTerm)
    );
  }
  return shown;
}

function updateSelectAllBox(shown){
  const n = shown.length;
  const nSel = shown.filter(t => selected.has(t.id)).length;
  selectAllBox.checked = n > 0 && nSel === n;
  selectAllBox.indeterminate = nSel > 0 && nSel < n;
}

function render(){
  const badgeIn = allTasks.filter(t => t.status === "cho_in").length;
  const badgeDG = allTasks.filter(t => t.status === "cho_dong_goi").length;
  const badgeXong = allTasks.filter(t => t.status === "xong").length;
  document.getElementById("badge-in").textContent = badgeIn;
  document.getElementById("badge-dong_goi").textContent = badgeDG;
  document.getElementById("badge-xong").textContent = badgeXong;

  const shown = getShown();
  updateSelectAllBox(shown);

  list.innerHTML = "";
  if(shown.length === 0){
    const emptyMsg = searchTerm ? "Không tìm thấy việc nào khớp."
      : currentTab === "in" ? "Chưa có việc nào. Thêm sản phẩm ở ô trên."
      : currentTab === "dong_goi" ? "Chưa có sản phẩm nào chờ đóng gói."
      : "Chưa có sản phẩm nào hoàn tất.";
    list.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    downloadAllWrap.style.display = "none";
    return;
  }

  const groups = groupShown(shown);
  groups.forEach(g => list.appendChild(renderOrderBox(g)));

  // Nút "Tải tất cả phiếu giao" chỉ hiện khi trong danh sách đang xem (theo
  // tab + từ khóa tìm kiếm hiện tại) có ít nhất 1 đơn đã đính kèm phiếu giao.
  const groupsWithLabel = groups.filter(g => g.shipLabelUrl);
  if(groupsWithLabel.length > 0){
    downloadAllWrap.style.display = "block";
    downloadAllBtn.textContent = `⬇️ Tải tất cả phiếu giao (${groupsWithLabel.length})`;
  } else {
    downloadAllWrap.style.display = "none";
  }
}

function renderOrderBox(g){
  const box = document.createElement("div");
  box.className = "order-box";

  let info = null;
  if(currentTab === "dong_goi"){
    info = orderPackInfo(g.orderId);
    box.classList.add(info.eligible ? "ready" : "warn");
  }

  const header = document.createElement("div");
  header.className = "order-header";

  if(editingOrderIds.has(g.orderId)){
    const input = document.createElement("input");
    input.type = "text";
    input.className = "order-title-input";
    input.value = g.orderName;
    const saveBtn = document.createElement("button");
    saveBtn.className = "save-icon";
    saveBtn.textContent = "Lưu";
    const commit = attachClickAwayCommit(header, () => renameOrder(g.orderId, input.value));
    saveBtn.addEventListener("click", commit);
    input.addEventListener("keydown", e => { if(e.key === "Enter") commit(); });
    header.appendChild(input);
    header.appendChild(saveBtn);
    setTimeout(() => input.focus(), 0);
  } else {
    const title = document.createElement("div");
    title.className = "order-title";
    const isExpanded = expandedShipLabelOrderId === g.orderId || uploadingShipLabelIds.has(g.orderId);
    title.innerHTML = `<span class="expand-caret">${isExpanded ? "▾" : "▸"}</span>` + escapeHtml(g.orderName)
      + (g.shipLabelUrl ? ` <span class="ship-label-chip" title="Đã đính kèm phiếu giao">📎</span>` : "");
    const editBtn = document.createElement("button");
    editBtn.className = "edit-icon";
    editBtn.textContent = "✏️";
    editBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      editingOrderIds.add(g.orderId);
      render();
    });
    header.classList.add("clickable");
    header.addEventListener("click", () => {
      expandedShipLabelOrderId = (expandedShipLabelOrderId === g.orderId) ? null : g.orderId;
      render();
    });
    header.appendChild(title);
    header.appendChild(editBtn);
  }
  box.appendChild(header);
  if(expandedShipLabelOrderId === g.orderId || uploadingShipLabelIds.has(g.orderId)){
    box.appendChild(renderShipLabelRow(g));
  }

  if(currentTab === "dong_goi" && info){
    const line = document.createElement("div");
    line.className = "order-status-line " + (info.eligible ? "ready" : "warn");
    line.textContent = info.eligible
      ? "Đủ hàng — có thể đóng gói cả đơn"
      : `Đơn chưa đủ — còn ${info.pending} sản phẩm đang in`;
    box.appendChild(line);

    if(info.eligible){
      const wrap = document.createElement("div");
      wrap.className = "pack-all-wrap";
      const btn = document.createElement("button");
      btn.className = "pack-all-btn";
      btn.textContent = "📦 Đóng gói cả đơn";
      btn.addEventListener("click", () => packWholeOrder(g.orderId));
      wrap.appendChild(btn);
      box.appendChild(wrap);
    }
  }

  g.items.forEach(t => box.appendChild(renderItem(t)));
  return box;
}

// Khu vực đính kèm/tải phiếu giao (PDF chứa mã đơn vận) — 1 file dùng chung
// cho cả đơn hàng (order-level), khác với "🔗 File in" ở từng sản phẩm.
function renderShipLabelRow(g){
  const rowEl = document.createElement("div");
  rowEl.className = "ship-label-row";

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = "application/pdf";
  fileInput.style.display = "none";
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if(f) uploadShipLabel(g.orderId, f);
    fileInput.value = "";
  });
  rowEl.appendChild(fileInput);

  if(uploadingShipLabelIds.has(g.orderId)){
    const busyBtn = document.createElement("button");
    busyBtn.className = "attach-btn";
    busyBtn.disabled = true;
    busyBtn.textContent = "⏳ Đang tải lên...";
    rowEl.appendChild(busyBtn);
    return rowEl;
  }

  if(g.shipLabelUrl){
    const viewBtn = document.createElement("button");
    viewBtn.className = "view-btn";
    viewBtn.textContent = "👁 Xem";
    // target="_blank" qua window.open — chỉ mở tab mới hiển thị PDF (trình
    // duyệt tự render), không tải file về máy như nút "Tải phiếu giao".
    viewBtn.addEventListener("click", () => window.open(g.shipLabelUrl, "_blank", "noopener"));
    rowEl.appendChild(viewBtn);

    const dlBtn = document.createElement("button");
    dlBtn.className = "download-btn";
    dlBtn.textContent = "⬇️ Tải phiếu giao";
    dlBtn.addEventListener("click", () => downloadShipLabel(g.shipLabelUrl, g.orderName));
    rowEl.appendChild(dlBtn);

    const replaceBtn = document.createElement("button");
    replaceBtn.className = "attach-btn";
    replaceBtn.textContent = "🔄 Thay file";
    replaceBtn.addEventListener("click", () => fileInput.click());
    rowEl.appendChild(replaceBtn);

    const rmBtn = document.createElement("button");
    rmBtn.className = "remove-btn";
    rmBtn.textContent = "🗑";
    rmBtn.title = "Xóa phiếu giao";
    rmBtn.addEventListener("click", () => removeShipLabel(g.orderId));
    rowEl.appendChild(rmBtn);
  } else {
    const attachBtn = document.createElement("button");
    attachBtn.className = "attach-btn";
    attachBtn.textContent = "📎 Đính kèm phiếu giao (PDF)";
    attachBtn.addEventListener("click", () => fileInput.click());
    rowEl.appendChild(attachBtn);
  }

  return rowEl;
}

function renderItem(t){
  const row = document.createElement("div");
  row.className = "order-item";

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = selected.has(t.id);
  cb.addEventListener("change", () => {
    if(cb.checked) selected.add(t.id); else selected.delete(t.id);
    updateBatchBar();
  });
  row.appendChild(cb);

  const info = document.createElement("div");
  info.className = "info";

  {
    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = t.name;
    if(t.link){
      const linkA = document.createElement("a");
      linkA.className = "task-linkchip";
      linkA.href = t.link;
      linkA.target = "_blank";
      linkA.rel = "noopener";
      linkA.textContent = "🔗 File in";
      nameDiv.appendChild(linkA);
    }
    if(currentTab === "xong" && t.shipped){
      const badge = document.createElement("span");
      badge.className = "shipped-badge";
      badge.textContent = "🚚 Đã giao";
      nameDiv.appendChild(badge);
    }
    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    metaDiv.textContent = "SL: " + (t.qty || 1);
    info.appendChild(nameDiv);
    info.appendChild(metaDiv);

    // Xem trước ghi chú ngay trên danh sách (không cần bấm Sửa mới thấy).
    // Dùng dạng xem trước thay vì tooltip vì tooltip cần hover, không dùng
    // được trên điện thoại (chạm) — xem trước luôn hiện + bấm vào để sửa
    // là cách hoạt động tốt trên di động hơn.
    if(t.note && !openNotes.has(t.id)){
      const preview = document.createElement("div");
      preview.className = "note-preview";
      preview.textContent = "📝 " + t.note;
      preview.addEventListener("click", () => { openNotes.add(t.id); render(); });
      info.appendChild(preview);
    }

    const actions = document.createElement("div");
    actions.className = "row-actions";

    if(currentTab !== "xong"){
      const advBtn = document.createElement("button");
      advBtn.className = "mini primary";
      advBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã đóng gói";
      advBtn.addEventListener("click", () => advanceStatus(t));
      actions.appendChild(advBtn);
    }

    if(currentTab === "dong_goi" || currentTab === "xong"){
      const revBtn = document.createElement("button");
      revBtn.className = "mini warnbtn";
      revBtn.textContent = "↩ Lùi lại";
      revBtn.addEventListener("click", () => revertStatus(t));
      actions.appendChild(revBtn);
    }

    if(currentTab === "xong"){
      const shipBtn = document.createElement("button");
      shipBtn.className = "mini" + (t.shipped ? "" : " primary");
      shipBtn.textContent = t.shipped ? "↩ Bỏ đã giao" : "🚚 Đã giao";
      shipBtn.addEventListener("click", () => toggleShipped(t));
      actions.appendChild(shipBtn);
    }

    const editBtn = document.createElement("button");
    editBtn.className = "mini";
    editBtn.textContent = "✏️ Sửa";
    editBtn.addEventListener("click", () => openTaskEditor(t));
    actions.appendChild(editBtn);

    const noteBtn = document.createElement("button");
    noteBtn.className = "mini";
    noteBtn.innerHTML = "📝 Ghi chú" + (t.note ? "<span class='note-dot'>•</span>" : "");
    noteBtn.addEventListener("click", () => {
      if(openNotes.has(t.id)) openNotes.delete(t.id); else openNotes.add(t.id);
      render();
    });
    actions.appendChild(noteBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "mini danger";
    delBtn.textContent = "🗑 Xóa";
    delBtn.addEventListener("click", () => deleteTask(t.id));
    actions.appendChild(delBtn);

    info.appendChild(actions);

    if(openNotes.has(t.id)){
      const noteBox = document.createElement("div");
      noteBox.className = "note-box";
      const ta = document.createElement("textarea");
      ta.placeholder = "Ghi chú cho việc này...";
      ta.value = t.note || "";
      const saveNoteBtn = document.createElement("button");
      saveNoteBtn.className = "note-save";
      saveNoteBtn.textContent = "Lưu ghi chú";
      const commit = attachClickAwayCommit(noteBox, async () => {
        await saveNote(t.id, ta.value);
        openNotes.delete(t.id);
        render();
      });
      saveNoteBtn.addEventListener("click", commit);
      noteBox.appendChild(ta);
      noteBox.appendChild(saveNoteBtn);
      info.appendChild(noteBox);
      setTimeout(() => ta.focus(), 0);
    }
  }

  row.appendChild(info);
  return row;
}

// ---- Actions ----

// Số ngày lưu trữ tối đa cho các item ở tab "Đã xong" trước khi Firestore TTL
// tự xoá (xem huong-dan.html / README về cách bật TTL policy trên field expireAt).
// Chỉnh số này nếu muốn thay đổi thời gian giữ lịch sử đối soát.
const XONG_RETENTION_DAYS = 7;

function computeExpireAt(){
  const ms = Date.now() + XONG_RETENTION_DAYS * 24 * 60 * 60 * 1000;
  return Timestamp.fromMillis(ms);
}

async function advanceStatus(t){
  const next = t.status === "cho_in" ? "cho_dong_goi" : "xong";
  const patch = { status: next, updatedAt: serverTimestamp() };
  // Chỉ khi thật sự VÀO "xong" mới gắn hạn tự xoá (expireAt).
  if(next === "xong") patch.expireAt = computeExpireAt();
  try{
    await updateDoc(doc(db, "tasks", t.id), patch);
  }catch(e){ showError("Không cập nhật được trạng thái: " + e.message); }
}

async function revertStatus(t){
  const prev = t.status === "cho_dong_goi" ? "cho_in" : t.status === "xong" ? "cho_dong_goi" : null;
  if(!prev) return;
  const patch = { status: prev, updatedAt: serverTimestamp() };
  if(t.status === "xong"){
    // Ra khỏi "xong" thì phải xoá expireAt — nếu không, item có thể bị TTL
    // xoá nhầm dù đang là việc chờ xử lý thật (chưa quay lại "xong" lần nữa).
    patch.expireAt = deleteField();
    // Đồng thời reset "đã giao" — nếu không, khi item hoàn tất LẠI lần sau
    // (thật sự), nhãn "🚚 Đã giao" cũ sẽ tự hiện sẵn dù chưa ai bấm, gây sai
    // lệch dữ liệu đối soát.
    patch.shipped = false;
  }
  try{
    await updateDoc(doc(db, "tasks", t.id), patch);
  }catch(e){ showError("Không lùi được trạng thái: " + e.message); }
}

// ---- Trích mã vận đơn từ PDF phiếu giao ----
// Có 2 cách, dùng kết hợp:
//  1) Đọc MÃ QR in trên phiếu (render trang PDF ra canvas rồi giải mã bằng
//     jsQR) — ĐÂY LÀ CÁCH CHÍNH. Mã QR trên các phiếu đã kiểm tra (J&T, SPX,
//     GHN) đều encode ĐÚNG mã vận đơn dạng chữ thuần, không kèm nhãn hay chữ
//     rác gì khác — nên không cần biết trước mẫu của từng hãng, không sợ hãng
//     đổi cách trình bày, và vẫn đọc được kể cả khi PDF là ảnh scan (miễn ảnh
//     đủ nét để thấy mã QR), vì làm việc trên ảnh render chứ không phụ thuộc
//     lớp text của PDF.
//  2) Đọc LỚP TEXT bằng pdf.js (cách cũ) — chỉ dùng làm DỰ PHÒNG khi trang
//     không có mã QR nào đọc được. Không còn dùng để suy ra tên hãng nữa —
//     kết quả trả về CHỈ LÀ chuỗi mã vận đơn (string), không kèm carrier.
async function renderPdfPageToCanvas(page, scale){
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(viewport.width);
  canvas.height = Math.ceil(viewport.height);
  const ctx = canvas.getContext("2d");
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas;
}

async function extractQrFromPdf(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  // Thử nhiều độ phân giải (scale) tăng dần: ảnh nét hơn thì đọc mã QR nhỏ dễ
  // hơn, nhưng cũng chậm hơn — nên chỉ tăng scale khi lần thử trước thất bại.
  const scales = [2, 3, 4];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    for(const scale of scales){
      const canvas = await renderPdfPageToCanvas(page, scale);
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = window.jsQR(imageData.data, imageData.width, imageData.height);
      if(qr && qr.data && qr.data.trim()){
        return qr.data.trim();
      }
    }
  }
  return null;
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = "";
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += " " + content.items.map(it => it.str).join(" ");
  }
  return text;
}

// Dự phòng khi không đọc được mã QR nào — dò trong lớp text. Trả về CHUỖI mã
// vận đơn hoặc null (không còn phân biệt hãng).
function detectTrackingFromText(text){
  // --- J&T Express: phiếu không ghi rõ nhãn "Mã vận đơn:" — mã vận đơn
  // chính là dãy số của mã vạch, lặp lại nhiều lần dọc theo lề phiếu. Phải
  // loại trừ "Order ID" (đó là mã đơn hàng của sàn TikTok Shop/Shopee, KHÔNG
  // phải mã vận đơn) rồi chọn dãy số xuất hiện nhiều lần nhất còn lại.
  if(/J\s*&\s*T/i.test(text)){
    const cleaned = text.replace(/Order\s*ID\s*:?\s*\d+/gi, "");
    const nums = cleaned.match(/\d{9,15}/g) || [];
    const freq = new Map();
    nums.forEach(n => freq.set(n, (freq.get(n) || 0) + 1));
    let best = null, bestCount = 0;
    for(const [n, c] of freq){ if(c > bestCount){ best = n; bestCount = c; } }
    return best || null;
  }
  // --- Các nhãn "họ Shopee" (SPX Express, hoặc đối tác Giao Hàng Nhanh) đều
  // ghi rõ nhãn "Mã vận đơn:" ngay trước mã.
  const m = text.match(/Mã vận đơn:?\s*([A-Za-z0-9]{5,})/i);
  return m ? m[1] : null;
}

async function extractTrackingFromPdf(file){
  // Không "nuốt" lỗi ở đây nữa — để lỗi văng ra ngoài cho nơi gọi phân biệt
  // được 2 trường hợp: "đọc PDF lỗi" (do thư viện/mạng) vs "đọc được nhưng
  // không khớp mẫu nào" (PDF ảnh scan hoặc mẫu hãng lạ).

  // Đọc song song cả 2 cách; ưu tiên QR, chỉ dùng text khi QR không ra gì.
  const [qrCode, text] = await Promise.all([
    extractQrFromPdf(file).catch(() => null),
    extractPdfText(file)
  ]);

  if(qrCode) return qrCode;

  return detectTrackingFromText(text);
}

// Tải file PDF lên Cloudinary (unsigned upload preset) rồi ghi URL vào mọi
// item cùng orderId (giống cách renameOrder() đồng bộ tên đơn). Dùng chung
// 1 public_id cố định theo orderId nên lần tải lên sau tự ghi đè file cũ
// (cần bật "Overwrite" cho upload preset "ship-labels" trên Cloudinary).
async function uploadShipLabel(orderId, file){
  if(!file) return;
  if(file.type !== "application/pdf"){
    showError("Chỉ chấp nhận file PDF cho phiếu giao.");
    return;
  }
  uploadingShipLabelIds.add(orderId);
  render();
  try{
    // URL (public_id) LUÔN cố định theo orderId nội bộ — không đổi dù đọc
    // được mã vận đơn hay không, để link luôn "vô danh" với người ngoài và
    // luôn ghi đè đúng 1 file (không phát sinh file mồ côi khi mã vận đơn
    // đổi giữa các lần tải lên). Chỉ TÊN FILE GỐC (display name trên
    // Cloudinary) mới đổi theo mã vận đơn khi đọc được, để tiện tìm kiếm
    // trong Media Library — tách biệt hoàn toàn khỏi URL thật.
    const publicId = `ship-labels/${orderId}`;
    const currentItem = allTasks.find(t => t.orderId === orderId);
    const currentName = (currentItem && currentItem.orderName) || "";
    let uploadFile = file;
    let trackingCode = null;
    let readErrorMsg = null;
    try{
      trackingCode = await extractTrackingFromPdf(file);
    }catch(e){
      readErrorMsg = (e && e.message) ? e.message : String(e);
    }
    if(trackingCode){
      const safeCode = trackingCode.replace(/[^A-Za-z0-9]/g, "");
      uploadFile = new File([file], `${safeCode}.pdf`, { type: file.type });
      const newTitle = trackingCode;
      const isAutoName = /^#[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{9}$/.test(currentName);
      const shouldRename = isAutoName ||
        confirm(`Đơn đang có tên "${currentName}".\nĐổi tên đơn thành "${newTitle}"?`);
      if(shouldRename) await renameOrder(orderId, newTitle);
    } else {
      if(readErrorMsg){
        showError("Không đọc được file PDF này để tự nhận diện mã vận đơn — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      } else {
        showError("Không nhận diện được mã vận đơn từ file này (mẫu lạ hoặc PDF ảnh scan) — vẫn tải phiếu lên bình thường, bạn có thể tự đổi tên đơn nếu cần.");
      }
      // Không giữ tên gốc lộn xộn từ điện thoại — đổi theo tên đơn hiện tại
      // (giống cách downloadShipLabel() đặt tên lúc tải xuống).
      const safeName = (currentName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
      uploadFile = new File([file], `phieu-giao-${safeName}.pdf`, { type: file.type });
    }
    const formData = new FormData();
    formData.append("file", uploadFile);
    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
    formData.append("public_id", publicId);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/raw/upload`, {
      method: "POST",
      body: formData
    });
    const data = await res.json();
    if(!res.ok) throw new Error((data && data.error && data.error.message) || ("HTTP " + res.status));
    const url = data.secure_url;
    const items = allTasks.filter(t => t.orderId === orderId);
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { shipLabelUrl: url, updatedAt: serverTimestamp() });
    }
  }catch(e){
    showError("Không tải lên được phiếu giao: " + e.message);
  }finally{
    uploadingShipLabelIds.delete(orderId);
    render();
  }
}

// Tải file về máy trực tiếp (không mở tab mới): fetch nguyên byte gốc thành
// blob rồi tự trigger tải — cách này bắt buộc phải dùng vì URL nằm khác domain
// (Cloudinary), thẻ <a download> trỏ thẳng URL cross-domain sẽ bị trình
// duyệt mở tab xem thay vì tải về.
async function downloadShipLabel(url, orderName){
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const safeName = (orderName || "don-hang").replace(/[^a-zA-Z0-9-_]+/g, "_");
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = `phieu-giao-${safeName}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    showError("Không tải được phiếu giao (có thể do cấu hình CORS trên Cloudinary): " + e.message);
  }
}

// Tải lần lượt (tuần tự, không đồng thời) mọi phiếu giao của các đơn ĐANG
// HIỂN THỊ trong danh sách hiện tại (theo tab + tìm kiếm) — tránh trình
// duyệt chặn khi kích hoạt quá nhiều tải xuống cùng lúc.
async function downloadAllShipLabels(){
  const groups = groupShown(getShown()).filter(g => g.shipLabelUrl);
  if(groups.length === 0){
    showError("Không có phiếu giao nào trong danh sách đang xem để tải.");
    return;
  }
  if(!confirm(`Tải xuống ${groups.length} phiếu giao đang hiển thị?`)) return;
  downloadAllBtn.disabled = true;
  const originalText = downloadAllBtn.textContent;
  for(let i = 0; i < groups.length; i++){
    downloadAllBtn.textContent = `⏳ Đang tải (${i + 1}/${groups.length})...`;
    await downloadShipLabel(groups[i].shipLabelUrl, groups[i].orderName);
  }
  downloadAllBtn.disabled = false;
  downloadAllBtn.textContent = originalText;
}
downloadAllBtn.addEventListener("click", downloadAllShipLabels);

async function renameOrder(orderId, newName){
  const n = (newName || "").trim() || newOrderName();
  const items = allTasks.filter(t => t.orderId === orderId);
  try{
    for(const it of items){
      await updateDoc(doc(db, "tasks", it.id), { orderName: n, updatedAt: serverTimestamp() });
    }
    editingOrderIds.delete(orderId);
    render();
  }catch(e){ showError("Không đổi được tên đơn: " + e.message); }
}

// ---- Batch actions ----
function updateBatchBar(){
  const n = selected.size;
  document.getElementById("batchCount").textContent = n + " đã chọn";
  const doneBtn = document.getElementById("batchDone");
  const shipBtn = document.getElementById("batchShip");
  if(currentTab === "xong"){
    doneBtn.style.display = "none";
    shipBtn.style.display = "inline-block";
  } else {
    doneBtn.style.display = "inline-block";
    doneBtn.textContent = currentTab === "in" ? "Đã in xong" : "Đã đóng gói";
    shipBtn.style.display = "none";
  }
  batchbar.classList.toggle("show", n > 0);
}

document.getElementById("batchShip").addEventListener("click", async () => {
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      await markShipped(id, true);
    }
  }catch(e){ showError("Lỗi khi đánh dấu đã giao theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDone").addEventListener("click", async () => {
  const ids = Array.from(selected);
  try{
    for(const id of ids){
      const t = allTasks.find(x => x.id === id);
      if(t) await advanceStatus(t);
    }
  }catch(e){ showError("Lỗi khi xử lý theo lô: " + e.message); }
  selected.clear();
  updateBatchBar();
});

document.getElementById("batchDel").addEventListener("click", async () => {
  if(!confirm("Xóa " + selected.size + " mục đã chọn?")) return;
  const ids = Array.from(selected);
  const emptiedOrders = orderIdsBecomingEmpty(ids);
  try{
    for(const id of ids){
      await deleteDoc(doc(db, "tasks", id));
    }
    for(const oid of emptiedOrders) await deleteShipLabelFileIfExists(oid);
  }catch(e){ showError("Không xóa được các mục đã chọn: " + e.message); }
  selected.clear();
  updateBatchBar();
});
